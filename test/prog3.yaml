- op: load_const
  value: 127
  dest_addr: 1
- op: load_const
  value: 80
  dest_addr: 2

# write value 127 to adress 80
- op: write_mem
  src_reg_addr: 1
  dest_mem_reg_addr: 2

# compare adress 80 (value 127) with reg 1 (value 127) and write resut to adress 81 (80 + 1)
- op: bin_eq
  left_mem_addr: 80
  right_reg_addr: 1
  result_base_reg_addr: 2
  offset: 1

# compare adress 81 (value 1) with reg 1 (value 127) and write resut to adress 82 (80 + 2)
- op: bin_eq
  left_mem_addr: 81
  right_reg_addr: 1
  result_base_reg_addr: 2
  offset: 2